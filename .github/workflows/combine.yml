name: Combine M3U Playlists

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["main"]
    types:
      - completed

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine M3U files
        run: |
          echo "#EXTM3U" > main.m3u

          declare -A lists
          lists["AKIL_MAIN"]="https://raw.githubusercontent.com/codedbyakil/Yogi/refs/heads/main/main.m3u"
          lists["SPORTS"]="https://example.com/sports.m3u"
          lists["MOVIES"]="https://example.com/movies.m3u"

          for name in "${!lists[@]}"
          do
            echo "" >> main.m3u
            echo "# ===== $name =====" >> main.m3u
            curl -s "${lists[$name]}" | grep -v '^#EXTM3U' >> main.m3u
          done

      - name: Commit and push update
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add main.m3u
          git commit -m "Auto update combined M3U" || echo "No changes"

          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
