name: Auto-Update Main M3U

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify others.m3u exists
        run: |
          OTHERS="workflows/others.m3u"
          if [ ! -f "$OTHERS" ]; then
            echo "❌ $OTHERS not found — aborting"
            exit 1
          fi
          echo "✅ $OTHERS located."

      - name: Normalize others.m3u
        run: |
          OTHERS="workflows/others.m3u"
          sudo apt-get update && sudo apt-get install -y dos2unix
          sed -i '1s/^\xEF\xBB\xBF//' "$OTHERS"
          dos2unix "$OTHERS" 2>/dev/null || sed -i 's/\r$//' "$OTHERS"
          sed -i 's/[ \t]*$//' "$OTHERS"

      - name: Build main.m3u (Live Tamil + others.m3u)
        id: build_main
        run: |
          OUTPUT="main.m3u"
          OTHERS="workflows/others.m3u"

          # 1️⃣ Header
          echo "#EXTM3U x-tvg-url=\"https://iptv-org.github.io/epg/guides/tamil.xml\"" > "$OUTPUT"

          # 2️⃣ ✅ Fetch & inject live Tamil channels (your 31)
          echo "# === LIVE TAMIL (JioTV) ===" >> "$OUTPUT"
          JSON_URL="https://jtv.pfy.workers.dev"
          JSON=$(curl -sfL --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36" \
            -H "Accept: application/json" \
            -H "Referer: https://playify.pages.dev/" \
            "$JSON_URL") || { echo "❌ Failed to fetch JSON"; exit 1; }
          if [ -z "$JSON" ] || [ "${JSON:0:1}" = "<" ]; then
            echo "❌ Response is empty or HTML"
            exit 1
          fi

          LIVE_COUNT=$(echo "$JSON" | jq -r '
            def channels:
              if type == "array" then .
              elif type == "object" then
                if has("channels") and (.channels | type == "array") then .channels
                elif has("data") and (.data | type == "array") then .data
                elif has("list") and (.list | type == "array") then .list
                elif (.[] | type == "object") then [.[]]
                else []
                end
              else []
              end;

            [
              "Sun TV HD",
              "Sun Music HD",
              "Sun Life",
              "Adithya TV",
              "KTV HD",
              "Star Vijay HD",
              "Vijay Super HD",
              "Colors Tamil",
              "Jaya TV HD",
              "Jaya Plus",
              "Jaya Max",
              "J Movies",
              "Polimer TV",
              "Vasanth TV",
              "Kalaignar TV",
              "Raj TV",
              "Disney",
              "Disney Junior",
              "Hungama TV",
              "Super Hungama",
              "Sonic Tamil",
              "Nick Tamil",
              "Nickelodeon Jr.",
              "Pogo",
              "Cartoon Network",
              "CN HD+ Tamil",
              "Discovery Kids Tamil",
              "D Tamil",
              "History HD"
            ] as $list |
            channels as $all |
            reduce $list[] as $target (0; 
              (. + (
                ($all | map(select(
                  (.name // .title // "") | ascii_downcase == ($target | ascii_downcase)
                )) | .[0]) as $match |
                if ($match | type == "object") and ($match.link // $match.url // "") != "" then 1 else 0 end
              ))
            )
          ')

          echo "$JSON" | jq -r '
            def channels:
              if type == "array" then .
              elif type == "object" then
                if has("channels") and (.channels | type == "array") then .channels
                elif has("data") and (.data | type == "array") then .data
                elif has("list") and (.list | type == "array") then .list
                elif (.[] | type == "object") then [.[]]
                else []
                end
              else []
              end;

            [
              "Sun TV HD",
              "Sun Music HD",
              "Sun Life",
              "Adithya TV",
              "KTV HD",
              "Star Vijay HD",
              "Vijay Super HD",
              "Colors Tamil",
              "Jaya TV HD",
              "Jaya Plus",
              "Jaya Max",
              "J Movies",
              "Polimer TV",
              "Vasanth TV",
              "Kalaignar TV",
              "Raj TV",
              "Disney",
              "Disney Junior",
              "Hungama TV",
              "Super Hungama",
              "Sonic Tamil",
              "Nick Tamil",
              "Nickelodeon Jr.",
              "Pogo",
              "Cartoon Network",
              "CN HD+ Tamil",
              "Discovery Kids Tamil",
              "D Tamil",
              "History HD"
            ] as $list |
            channels as $all |
            $list[] as $target |
            ($all | map(select(
              (.name // .title // "") | ascii_downcase == ($target | ascii_downcase)
            )) | .[0]) as $match |
            if ($match | type == "object") and ($match.link // $match.url // "") != "" then
              $match |
              (.name // .title // $target) as $name |
              (.tvg_id // .tvgId // .id // "") as $tvg_id |
              (.tvg_logo // .logo // .icon // "") as $tvg_logo |
              (.drmScheme // .drm_scheme // .drm // "") as $drmScheme |
              (.drmLicense // .license // "") as $drmLicense |
              (.cookie // .cookies // "") as $cookie |
              (.link // .url // .stream_url // .hls // .mpd // "") as $link |
              "#EXTINF:-1 " +
                (if ($tvg_id | length > 0) then "tvg-id=\"\($tvg_id)\" " else "" end) +
                "group-title=\"Tamil\" " +
                (if ($tvg_logo | length > 0) then "tvg-logo=\"\($tvg_logo)\" " else "" end) +
                ",\($name | gsub(","; "\\,"))" |
              . as $extinf |
              (if ($drmScheme == "clearkey") and ($drmLicense | test("^[a-zA-Z0-9]+:[a-zA-Z0-9]+")) then
                "#KODIPROP:inputstream.adaptive.license_type=clearkey\n#KODIPROP:inputstream.adaptive.license_key=" + 
                ($drmLicense | split(":")[0:2] | join(":"))
              else "" end) as $drm |
              "#EXTVLCOPT:http-user-agent=plaYtv/7.1.5%20(Linux%3BAndroid%2015)%20ExoPlayerLib/2.11.6%20YGX/69.69.69.69" as $ua |
              (if ($cookie | length > 0) then
                "#EXTHTTP:{\"cookie\":\"" + ($cookie | gsub("\""; "\\\"")) + "\"}"
              else "" end) as $cookie_line |
              [
                $extinf,
                ($drm | select(. != "")),
                $ua,
                ($cookie_line | select(. != "")),
                $link
              ] | join("\n")
            else empty end
          ' >> "$OUTPUT"

          # 3️⃣ Append others.m3u (pass-through, skip its #EXTM3U if present)
          echo "" >> "$OUTPUT"
          echo "# === STATIC CHANNELS (from workflows/others.m3u) ===" >> "$OUTPUT"
          awk '
            /^#EXTM3U/ { next }
            NF == 0 { next }
            { print }
          ' "$OTHERS" >> "$OUTPUT"

          # 4️⃣ Stats
          TAMIL=$(grep -c '^#EXTINF:-1.*group-title="Tamil"' "$OUTPUT" 2>/dev/null || echo 0)
          OTHERS_COUNT=$(grep -c '^#EXTINF' "$OUTPUT" 2>/dev/null || echo 0)
          OTHERS_COUNT=$((OTHERS_COUNT - TAMIL))
          TOTAL=$((TAMIL + OTHERS_COUNT))
          echo "✅ main.m3u built with $TOTAL channels:"
          echo "   🎯 Live Tamil (JioTV): $LIVE_COUNT (found: $TAMIL)"
          echo "   📦 Static (others.m3u): $OTHERS_COUNT"
          echo "tamil=$TAMIL" >> "$GITHUB_OUTPUT"
          echo "others=$OTHERS_COUNT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$TAMIL" -eq 0 ]; then
            echo "⚠️ Warning: No live Tamil channels found"
            echo "🔍 Top 10 channel names in JSON:"
            echo "$JSON" | jq -r 'channels | .[0:10][] | .name // .title // "–"' 2>/dev/null
          fi

      - name: Commit main.m3u
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.m3u
          if git diff --cached --quiet; then
            echo "➡️ No changes — skipping commit"
            exit 0
          fi
          git commit -m "📺 main.m3u: ${{ steps.build_main.outputs.tamil }} Live Tamil + ${{ steps.build_main.outputs.others }} Static | $(date -u '+%Y-%m-%d %H:%M')"
          git push origin main
