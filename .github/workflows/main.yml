name: Auto-Update Main M3U

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify other.m3u exists
        run: |
          OTHER_M3U=".github/workflows/other.m3u"
          if [ ! -f "$OTHER_M3U" ]; then
            echo "❌ $OTHER_M3U not found — aborting"
            exit 1
          fi
          echo "✅ $OTHER_M3U located."

      - name: Normalize other.m3u
        run: |
          OTHER_M3U=".github/workflows/other.m3u"
          sudo apt-get update && sudo apt-get install -y dos2unix
          sed -i '1s/^\xEF\xBB\xBF//' "$OTHER_M3U"
          dos2unix "$OTHER_M3U" 2>/dev/null || sed -i 's/\r$//' "$OTHER_M3U"
          sed -i 's/[ \t]*$//' "$OTHER_M3U"

      - name: Download and normalize vod.m3u
        id: download_vod
        run: |
          VOD_URL="https://raw.githubusercontent.com/codedbyakil/VOD/refs/heads/main/vod.m3u"
          VOD_FILE="vod_temp.m3u"
          
          echo "📥 Fetching VOD playlist from $VOD_URL"
          for i in {1..3}; do
            if curl -sfL --max-time 30 \
              -H "User-Agent: Mozilla/5.0 (compatible; GitHub-Actions)" \
              -o "$VOD_FILE" "$VOD_URL"; then
              echo "✅ Download succeeded on attempt $i"
              break
            else
              echo "⚠️ Attempt $i failed, retrying in 2s..."
              sleep 2
            fi
            if [ $i -eq 3 ]; then
              echo "❌ All 3 attempts failed to download vod.m3u"
              exit 1
            fi
          done

          if [ ! -s "$VOD_FILE" ]; then
            echo "❌ vod.m3u is empty — aborting"
            exit 1
          fi

          # Normalize
          sed -i '1s/^\xEF\xBB\xBF//' "$VOD_FILE"
          dos2unix "$VOD_FILE" 2>/dev/null || sed -i 's/\r$//' "$VOD_FILE"
          sed -i 's/[ \t]*$//' "$VOD_FILE"

          COUNT=$(grep -c '^#EXTINF:' "$VOD_FILE" 2>/dev/null || echo 0)
          echo "✅ vod.m3u loaded — $COUNT channel(s)"
          echo "vod_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Build main.m3u (Live Tamil + other.m3u + VOD)
        id: build_main
        run: |
          OUTPUT="main.m3u"
          OTHER_M3U=".github/workflows/other.m3u"
          VOD_FILE="vod_temp.m3u"

          # 1️⃣ Header
          echo "#EXTM3U x-tvg-url=\"https://iptv-org.github.io/epg/guides/tamil.xml\"" > "$OUTPUT"

          # 2️⃣ Fetch & inject live Tamil channels — SAFE curl + validation
          echo "# === LIVE TAMIL (JioTV) ===" >> "$OUTPUT"

          JSON_URL="https://ztv.pfy.workers.dev"  # ✅ NO TRAILING SPACE

          echo "📡 Fetching live channel list from $JSON_URL"
          JSON_RAW=""
          for i in {1..3}; do
            JSON_RAW=$(curl -sfL --max-time 25 \
              -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36" \
              -H "Accept: application/json, text/plain" \
              -H "Referer: https://playify.pages.dev/" \
              -H "Origin: https://playify.pages.dev" \
              "$JSON_URL" 2>/dev/null) && break
            echo "⚠️ Attempt $i failed, retrying in 3s..."
            sleep 3
          done

          if [ -z "$JSON_RAW" ]; then
            echo "❌ All retries failed — no response from $JSON_URL"
            exit 1
          fi

          # Check for HTML error (e.g., 4xx/5xx page)
          if [[ "${JSON_RAW:0:1}" == "<" ]]; then
            echo "❌ Received HTML (likely error page). First 300 chars:"
            echo "$JSON_RAW" | head -c 300
            echo
            exit 1
          fi

          # Validate JSON (jq parse test)
          if ! echo "$JSON_RAW" | jq empty >/dev/null 2>&1; then
            echo "❌ Invalid JSON — jq parse failed. First 500 chars:"
            echo "$JSON_RAW" | head -c 500
            echo
            exit 1
          fi

          # Now safe to use
          JSON="$JSON_RAW"

          # Precompute count
          LIVE_COUNT=$(echo "$JSON" | jq -r '
            def channels:
              if type == "array" then .
              elif type == "object" then
                if has("channels") and (.channels | type == "array") then .channels
                elif has("data") and (.data | type == "array") then .data
                elif has("list") and (.list | type == "array") then .list
                elif (.[] | type == "object") then [.[]]
                else []
                end
              else []
              end;

            [
              "Sun TV HD", "Sun Music HD", "Sun Life", "Adithya TV", "KTV HD",
              "Star Vijay HD", "Vijay Super HD", "Colors Tamil", "Jaya TV HD",
              "Jaya Plus", "Jaya Max", "J Movies", "Polimer TV", "Vasanth TV",
              "Kalaignar TV", "Raj TV", "Disney Channel", "Disney Junior", "Hungama",
              "Super Hungama", "Sonic Tamil", "Nick Tamil", "Nickelodeon Jr.",
              "Pogo", "Cartoon Network", "CN HD+ Tamil", "Discovery Kids Tamil",
              "D Tamil", "History HD"
            ] as $list |
            channels as $all |
            [ $list[] as $name |
              ($all | map(select(
                (.name // .title // "") | ascii_downcase == ($name | ascii_downcase)
              )) | .[0]) as $match |
              select(($match | type == "object") and ($match.link // $match.url // "") != "")
            ] | length
          ')

          # Generate entries
          echo "$JSON" | jq -r '
            def channels:
              if type == "array" then .
              elif type == "object" then
                if has("channels") and (.channels | type == "array") then .channels
                elif has("data") and (.data | type == "array") then .data
                elif has("list") and (.list | type == "array") then .list
                elif (.[] | type == "object") then [.[]]
                else []
                end
              else []
              end;

            [
              "Sun TV HD", "Sun Music HD", "Sun Life", "Adithya TV", "KTV HD",
              "Star Vijay HD", "Vijay Super HD", "Colors Tamil", "Jaya TV HD",
              "Jaya Plus", "Jaya Max", "J Movies", "Polimer TV", "Vasanth TV",
              "Kalaignar TV", "Raj TV", "Disney Channel", "Disney Junior", "Hungama",
              "Super Hungama", "Sonic Tamil", "Nick Tamil", "Nickelodeon Jr.",
              "Pogo", "Cartoon Network", "CN HD+ Tamil", "Discovery Kids Tamil",
              "D Tamil", "History HD"
            ] as $list |
            channels as $all |
            $list[] as $target |
            ($all | map(select(
              (.name // .title // "") | ascii_downcase == ($target | ascii_downcase)
            )) | .[0]) as $match |
            if ($match | type == "object") and ($match.link // $match.url // "") != "" then
              $match |
              (.name // .title // $target) as $name |
              (.tvg_id // .tvgId // .id // "") as $tvg_id |
              (.tvg_logo // .logo // .icon // "") as $tvg_logo |
              (.drmScheme // .drm_scheme // .drm // "") as $drmScheme |
              (.drmLicense // .license // "") as $drmLicense |
              (.cookie // .cookies // "") as $cookie |
              (.link // .url // .stream_url // .hls // .mpd // "") as $link |
              "#EXTINF:-1 " +
                (if ($tvg_id | length > 0) then "tvg-id=\"\($tvg_id)\" " else "" end) +
                "group-title=\"Tamil\" " +
                (if ($tvg_logo | length > 0) then "tvg-logo=\"\($tvg_logo)\" " else "" end) +
                ",\($name | gsub(","; "\\,"))" |
              . as $extinf |
              (if ($drmScheme == "clearkey") and ($drmLicense | test("^[a-zA-Z0-9]+:[a-zA-Z0-9]+")) then
                "#KODIPROP:inputstream.adaptive.license_type=clearkey\n#KODIPROP:inputstream.adaptive.license_key=" + 
                ($drmLicense | split(":")[0:2] | join(":"))
              else "" end) as $drm |
              "#EXTVLCOPT:http-user-agent=plaYtv/7.1.5%20(Linux%3BAndroid%2015)%20ExoPlayerLib/2.11.6%20YGX/69.69.69.69" as $ua |
              (if ($cookie | length > 0) then
                "#EXTHTTP:{\"cookie\":\"" + ($cookie | gsub("\""; "\\\"")) + "\"}"
              else "" end) as $cookie_line |
              [
                $extinf,
                ($drm | select(. != "")),
                $ua,
                ($cookie_line | select(. != "")),
                $link
              ] | join("\n")
            else empty end
          ' >> "$OUTPUT"

          # 3️⃣ Append static channels
          echo "" >> "$OUTPUT"
          echo "# === STATIC CHANNELS (from .github/workflows/other.m3u) ===" >> "$OUTPUT"
          awk '
            /^#EXTM3U/ { next }
            NF == 0 { next }
            { print }
          ' "$OTHER_M3U" >> "$OUTPUT"

          # 4️⃣ Append VOD — robust group-title enforcement
          echo "" >> "$OUTPUT"
          echo "# === VOD (from tamilrepo-dev/VOD) ===" >> "$OUTPUT"
          awk '
            BEGIN { RS = "\r?\n"; ORS = "\n" }
            /^#EXTM3U/ { next }
            NF == 0 { next }
            /^#EXTINF:/ {
              line = $0
              # Force group-title="VOD"
              if (match(line, /group-title="[^"]*"/)) {
                gsub(/group-title="[^"]*"/, "group-title=\"VOD\"", line)
              } else {
                if (match(line, /#EXTINF:-1 /)) {
                  sub(/#EXTINF:-1 /, "#EXTINF:-1 group-title=\"VOD\" ", line)
                } else if (match(line, /#EXTINF:-1,/)) {
                  sub(/#EXTINF:-1,/, "#EXTINF:-1 group-title=\"VOD\",", line)
                } else {
                  sub(/#EXTINF:/, "#EXTINF: group-title=\"VOD\" ", line)
                }
              }
              print line
              if ((getline nextline) > 0) {
                print nextline
              } else {
                print ""
              }
              next
            }
            { print }
          ' "$VOD_FILE" >> "$OUTPUT"

          # 5️⃣ Stats
          TAMIL=$(grep -c '^#EXTINF:-1.*group-title="Tamil"' "$OUTPUT" 2>/dev/null || echo 0)
          STATIC=$(awk '/^#EXTINF:/ && !/group-title="Tamil"/ && !/group-title="VOD"/ {count++} END {print count+0}' "$OUTPUT")
          VOD=$(grep -c '^#EXTINF.*group-title="VOD"' "$OUTPUT" 2>/dev/null || echo 0)
          TOTAL=$((TAMIL + STATIC + VOD))
          echo "✅ main.m3u built with $TOTAL channels:"
          echo "   🎯 Live Tamil (JioTV): $LIVE_COUNT (found: $TAMIL)"
          echo "   📦 Static (other.m3u): $STATIC"
          echo "   🎬 VOD (tamilrepo-dev): $VOD"
          echo "tamil=$TAMIL" >> "$GITHUB_OUTPUT"
          echo "static=$STATIC" >> "$GITHUB_OUTPUT"
          echo "vod=${{ steps.download_vod.outputs.vod_count }}" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$TAMIL" -eq 0 ]; then
            echo "⚠️ No live Tamil channels found — JSON summary:"
            echo "$JSON" | jq -r '
              def channels:
                if type == "array" then .
                elif type == "object" then
                  if has("channels") and (.channels | type == "array") then .channels
                  elif has("data") and (.data | type == "array") then .data
                  elif has("list") and (.list | type == "array") then .list
                  elif (.[] | type == "object") then [.[]]
                  else []
                  end
                else []
                end;
              channels | .[0:8] | .[] | (.name // .title // .id // "–")' 2>/dev/null
          fi

      - name: Commit main.m3u
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.m3u
          if git diff --cached --quiet; then
            echo "➡️ No changes — skipping commit"
            exit 0
          fi
          git commit -m "📺 main.m3u: ${{ steps.build_main.outputs.tamil }} Live Tamil + ${{ steps.build_main.outputs.static }} Static + ${{ steps.build_main.outputs.vod }} VOD | $(date -u '+%Y-%m-%d %H:%M')"
          git push origin main
