name: Auto-Update Main M3U

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  build-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq dos2unix

      - name: Verify other.m3u exists
        run: |
          OTHER=".github/workflows/other.m3u"
          [ -f "$OTHER" ] || { echo "❌ other.m3u missing"; exit 1; }
          sed -i '1s/^\xEF\xBB\xBF//' "$OTHER"
          dos2unix "$OTHER" 2>/dev/null || sed -i 's/\r$//' "$OTHER"

      - name: Download VOD
        id: vod
        run: |
          URL="https://raw.githubusercontent.com/codedbyakil/VOD/refs/heads/main/vod.m3u"
          FILE="vod.m3u"

          curl -sfL "$URL" -o "$FILE" || exit 1
          sed -i '1s/^\xEF\xBB\xBF//' "$FILE"
          dos2unix "$FILE" 2>/dev/null || sed -i 's/\r$//' "$FILE"

          COUNT=$(grep -c '^#EXTINF:' "$FILE" || echo 0)
          echo "vod_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Build main.m3u
        id: build
        run: |
          OUT="main.m3u"
          OTHER=".github/workflows/other.m3u"
          VOD="vod.m3u"

          echo "#EXTM3U" > "$OUT"
          echo "# === LIVE TAMIL ===" >> "$OUT"

          JSON=$(curl -sL "https://ztv.pfy.workers.dev")

          # VALIDATION
          echo "$JSON" | jq empty || { echo "❌ Invalid JSON"; exit 1; }

          echo "$JSON" | jq -r '
            def channels:
              if type=="array" then .
              elif type=="object" then
                if has("channels") then .channels
                elif has("data") then .data
                elif has("list") then .list
                else [.[]]
                end
              else [] end;

            [
              "Sun TV HD","Sun Music HD","Sun Life","Adithya TV","KTV HD",
              "Star Vijay HD","Vijay Super HD","Colors Tamil","Jaya TV HD",
              "Jaya Plus","Jaya Max","J Movies","Polimer TV","Vasanth TV",
              "Kalaignar TV","Raj TV","Disney","Disney Junior","Hungama TV",
              "Super Hungama","Sonic Tamil","Nick Tamil","Nickelodeon Jr.",
              "Pogo","Cartoon Network","CN HD+ Tamil","Discovery Kids Tamil",
              "D Tamil","History HD"
            ] as $list |

            channels as $all |

            $list[] as $target |

            ($all | map(select(
              (.name // .title // "") | ascii_downcase == ($target | ascii_downcase)
            )) | .[0]) as $c |

            if ($c | type=="object") then

              ($c.name // $target) as $name |
              ($c.id // "") as $id |
              ($c.logo // "") as $logo |

              ($c.mpd_url // $c.link // $c.url // "") as $raw |
              ($c.license_url // $c.drmLicense // "") as $license |
              ($c.headers.cookie // $c.cookie // "") as $cookie |
              ($c.drmScheme // "") as $scheme |

              ($raw | split("|")) as $p |
              ($p[0]) as $url |
              ($p[1] // "") as $drm |

              (if ($drm|test("drmScheme="))
                then ($drm|capture("drmScheme=(?<d>[^&]+)")|.d)
                else $scheme end) as $finalScheme |

              if ($url|length)>0 then

                "#EXTINF:-1 group-title=\"Tamil\" tvg-id=\"\($id)\" tvg-logo=\"\($logo)\",\($name)",

                (if $finalScheme=="clearkey" and ($license|length)>0 then
                  "#KODIPROP:inputstream.adaptive.license_type=clearkey\n#KODIPROP:inputstream.adaptive.license_key=\($license)"
                else empty end),

                (if ($cookie|length)>0 then
                  "#EXTHTTP:{\"cookie\":\"\($cookie | gsub("\""; "\\\""))\"}"
                else empty end),

                $url,
                ""

              else empty end

            else empty end
          ' >> "$OUT"

          # STATIC
          echo "# === STATIC ===" >> "$OUT"
          awk '!/^#EXTM3U/' "$OTHER" >> "$OUT"

          # VOD
          echo "# === VOD ===" >> "$OUT"
          awk '
            /^#EXTINF:/ {
              if ($0 !~ /group-title=/)
                sub("#EXTINF:-1", "#EXTINF:-1 group-title=\"VOD\"")
            }
            !/^#EXTM3U/
          ' "$VOD" >> "$OUT"

          TOTAL=$(grep -c '^#EXTINF' "$OUT" || echo 0)
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "✅ Built main.m3u ($TOTAL entries)"

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add main.m3u

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto update main.m3u ($(date -u '+%Y-%m-%d %H:%M'))"
          git push
